<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Azure VM web server deployment design</title>
<desc id="desc">A user browser sends an HTTP request to an Azure public IP and network security group, which forwards allowed HTTP traffic to an Ubuntu virtual machine running Nginx that serves a static HTML website.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#496783"/></marker>
  <style>
    .h{font:700 27px Arial,sans-serif;fill:#102a43}
    .t{font:700 20px Arial,sans-serif;fill:#17324d}
    .s{font:16px Arial,sans-serif;fill:#334e68}
    .small{font:14px Arial,sans-serif;fill:#486581}
    .line{stroke:#496783;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1100" height="700" fill="#f5f8fc" rx="24"/>
<text x="550" y="48" text-anchor="middle" class="h">Azure VM Web Server — Deployment Design</text>
<text x="550" y="76" text-anchor="middle" class="small">Architecture concept only • No live Azure resources created</text>

<rect x="365" y="108" width="370" height="88" rx="15" fill="#ffffff" stroke="#9fb3c8" stroke-width="2"/>
<text x="550" y="143" text-anchor="middle" class="t">User Browser</text>
<text x="550" y="170" text-anchor="middle" class="s">HTTP request to website</text>

<path d="M550 196 V238" class="line"/>
<text x="570" y="222" class="small">HTTP / TCP 80</text>

<rect x="245" y="245" width="610" height="135" rx="18" fill="#eaf4ff" stroke="#0878d1" stroke-width="2.5"/>
<text x="550" y="276" text-anchor="middle" class="t">Microsoft Azure (planned)</text>
<rect x="275" y="295" width="250" height="62" rx="10" fill="#ffffff" stroke="#6ba7d8" stroke-width="2"/>
<text x="400" y="320" text-anchor="middle" class="t" style="font-size:17px">Public IP</text>
<text x="400" y="342" text-anchor="middle" class="small">Public web endpoint</text>
<rect x="575" y="295" width="250" height="62" rx="10" fill="#ffffff" stroke="#6ba7d8" stroke-width="2"/>
<text x="700" y="320" text-anchor="middle" class="t" style="font-size:17px">Network Security Group</text>
<text x="700" y="342" text-anchor="middle" class="small">Allow HTTP 80; restrict SSH 22</text>
<path d="M525 326 H570" class="line"/>

<path d="M550 380 V426" class="line"/>
<text x="570" y="408" class="small">Allowed HTTP traffic</text>

<rect x="245" y="433" width="610" height="125" rx="18" fill="#e8f7ef" stroke="#168454" stroke-width="2.5"/>
<text x="550" y="466" text-anchor="middle" class="t">Ubuntu Linux Virtual Machine</text>
<rect x="290" y="485" width="230" height="52" rx="10" fill="#ffffff" stroke="#79b99a" stroke-width="2"/>
<text x="405" y="517" text-anchor="middle" class="t" style="font-size:18px">Nginx Web Server</text>
<rect x="580" y="485" width="230" height="52" rx="10" fill="#ffffff" stroke="#79b99a" stroke-width="2"/>
<text x="695" y="517" text-anchor="middle" class="t" style="font-size:18px">index.html + CSS</text>
<path d="M520 511 H575" class="line"/>

<text x="550" y="603" text-anchor="middle" class="s">GitHub Pages hosts this documentation demo separately.</text>
<text x="550" y="630" text-anchor="middle" class="small">The Azure VM architecture above must be deployed and tested separately.</text>
<text x="550" y="662" text-anchor="middle" class="small">Project 01 • Azure Cloud Engineer Internship Portfolio</text>
</svg>
